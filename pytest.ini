[pytest]
testpaths = tests
# A test that deadlocks used to cost minutes of a session; now it fails with a
# traceback.  thread: the signal method cannot interrupt a blocking C call.
timeout = 30
timeout_method = thread
pythonpath = src
filterwarnings =
    ignore::DeprecationWarning
markers =
    qt: Tests that require a Qt display (QT_QPA_PLATFORM=offscreen is used by default)
